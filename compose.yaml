services:
  sim:
    build: .
    container_name: ros-gz-sim
    user: "${UID}:${GID}"
    working_dir: /work/ws
    network_mode: host

    gpus: all
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=graphics,compute,utility
      - __GLX_VENDOR_LIBRARY_NAME=nvidia
      - LIBGL_DRI3_DISABLE=1

      - ROS_DOMAIN_ID=42
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp   # or rmw_fastrtps_cpp if you prefer

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./ws:/work/ws:rw

    stdin_open: true
    tty: true

    # keep the container running; every exec shell has ROS sourced via /etc/bash.bashrc
    command: bash -lc "tail -f /dev/null"